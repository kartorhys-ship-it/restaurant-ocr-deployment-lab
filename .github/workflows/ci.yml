name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Restaurant OCR Benchmark Repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Backend Unit & Smoke Tests
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Checkout Frozen Safety Harness (v1.2.6)
        uses: actions/checkout@v4
        with:
          repository: kartorhys-ship-it/fullstack-deployment-skill
          ref: v1.2.6
          path: fullstack-deployment-skill

      - name: Run Benchmark Attack Scenarios Against Frozen Harness
        env:
          HARNESS_PATH: ${{ github.workspace }}/fullstack-deployment-skill
        run: |
          python -m unittest discover -s tests/benchmark -p "test_*.py" -v

  nginx-syntax-validation:
    name: Nginx Configuration Validation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Nginx & OpenSSL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx openssl

      - name: Set up SSL Cert Stubs and Nginx Snippets
        run: |
          # 1. Install security headers snippet
          sudo mkdir -p /etc/nginx/snippets /etc/nginx/sites-available /etc/nginx/sites-enabled
          sudo cp deploy/nginx/security-headers.conf /etc/nginx/snippets/security-headers.conf

          # 2. Generate self-signed certificate stub matching production path
          sudo mkdir -p /etc/letsencrypt/live/receipt-app
          sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /etc/letsencrypt/live/receipt-app/privkey.pem \
            -out /etc/letsencrypt/live/receipt-app/fullchain.pem \
            -subj "/CN=receipts.restaurant-domain.internal"

          # 3. Create mock web root
          sudo mkdir -p /srv/receipt-app/current/frontend/dist
          echo "<h1>Receipt App</h1>" | sudo tee /srv/receipt-app/current/frontend/dist/index.html

          # 4. Link site configuration
          sudo cp deploy/nginx/receipt-app.conf /etc/nginx/sites-available/receipt-app.conf
          sudo ln -sfn /etc/nginx/sites-available/receipt-app.conf /etc/nginx/sites-enabled/receipt-app.conf

      - name: Test Nginx Syntax (Fail-Closed)
        run: |
          sudo nginx -t
