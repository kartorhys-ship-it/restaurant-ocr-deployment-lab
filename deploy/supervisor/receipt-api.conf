[program:receipt-api]
directory=/srv/receipt-app/current
command=/srv/receipt-app/current/backend/venv/bin/gunicorn backend.app.main:app --bind 127.0.0.1:8000 -k uvicorn.workers.UvicornWorker
user=deployer
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
environment=
    PORT="8000",
    DATABASE_URL="<SECRET_REF_DATABASE_URL>",
    REDIS_URL="<SECRET_REF_REDIS_URL>",
    R2_ACCESS_KEY="<SECRET_REF_R2_ACCESS_KEY>",
    R2_SECRET_KEY="<SECRET_REF_R2_SECRET_KEY>",
    OCR_API_KEY="<SECRET_REF_OCR_API_KEY>",
    APP_ENV="production"
stdout_logfile=/srv/receipt-app/shared/logs/receipt-api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/srv/receipt-app/shared/logs/receipt-api.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
