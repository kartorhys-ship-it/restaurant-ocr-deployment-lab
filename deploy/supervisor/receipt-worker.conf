[program:receipt-worker]
directory=/srv/receipt-app/current
command=/srv/receipt-app/current/backend/venv/bin/python -m backend.app.workers.ocr_worker
user=deployer
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
environment=
    REDIS_URL="<SECRET_REF_REDIS_URL>",
    QUEUE_NAME="receipt_ocr",
    DATABASE_URL="<SECRET_REF_DATABASE_URL>",
    R2_ACCESS_KEY="<SECRET_REF_R2_ACCESS_KEY>",
    R2_SECRET_KEY="<SECRET_REF_R2_SECRET_KEY>",
    OCR_API_KEY="<SECRET_REF_OCR_API_KEY>",
    APP_ENV="production"
stdout_logfile=/srv/receipt-app/shared/logs/receipt-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/srv/receipt-app/shared/logs/receipt-worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
